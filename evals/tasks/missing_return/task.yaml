id: missing_return
title: 缺 return：first_even 总是返回 None，函数体里忘了把结果返回
prompt: '运行 `python -m pytest test_finder.py -q` 有用例失败：first_even 总是返回 None，函数体里忘了把结果返回。

  请阅读 finder.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 finder.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- finder.py
protected_paths:
- test_finder.py
items:
