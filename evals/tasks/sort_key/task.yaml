id: sort_key
title: 排序 key 错：top_scores 按分数升序排列，约定应为分数最高的在前
prompt: '运行 `python -m pytest test_leaderboard.py -q` 有用例失败：top_scores 按分数升序排列，约定应为分数最高的在前。

  请阅读 leaderboard.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 leaderboard.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- leaderboard.py
protected_paths:
- test_leaderboard.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_leaderboard.py -q
- id: tests-unchanged
  type: protected
  path: test_leaderboard.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
