id: string_format
title: 字符串格式化错误：display_name 把名和姓的顺序弄反了
prompt: '运行 `python -m pytest test_greeting.py -q` 有用例失败：display_name 把名和姓的顺序弄反了。

  请阅读 greeting.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 greeting.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- greeting.py
protected_paths:
- test_greeting.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_greeting.py -q
- id: tests-unchanged
  type: protected
  path: test_greeting.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
