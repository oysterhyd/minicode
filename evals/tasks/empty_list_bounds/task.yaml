id: empty_list_bounds
title: 空列表越界：空列表时 first_or_default 抛 IndexError，约定应返回 default
prompt: '运行 `python -m pytest test_picker.py -q` 有用例失败：空列表时 first_or_default 抛 IndexError，约定应返回
  default。

  请阅读 picker.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 picker.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- picker.py
protected_paths:
- test_picker.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_picker.py -q
- id: tests-unchanged
  type: protected
  path: test_picker.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
