id: regex_mismatch
title: 正则写错：is_valid_zip 对 6 位数字也返回 True，正则没有锚定
prompt: '运行 `python -m pytest test_validator.py -q` 有用例失败：is_valid_zip 对 6 位数字也返回 True，正则没有锚定。

  请阅读 validator.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 validator.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- validator.py
protected_paths:
- test_validator.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_validator.py -q
- id: tests-unchanged
  type: protected
  path: test_validator.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
