id: pagination_bounds
title: 分页边界：非末页会多返回一个元素，has_next 也随之错位
prompt: '运行 `python -m pytest test_paginate.py -q` 有用例失败：非末页会多返回一个元素，has_next 也随之错位。

  请阅读 paginate.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 paginate.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- paginate.py
protected_paths:
- test_paginate.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_paginate.py -q
- id: tests-unchanged
  type: protected
  path: test_paginate.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
