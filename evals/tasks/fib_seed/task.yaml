id: fib_seed
title: 斐波那契种子错：fib 全部返回 0，序列种子 (a, b) 写成了 (0, 0)
prompt: '运行 `python -m pytest test_fib.py -q` 有用例失败：fib 全部返回 0，序列种子 (a, b) 写成了 (0, 0)。

  请阅读 fib.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 fib.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- fib.py
protected_paths:
- test_fib.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_fib.py -q
- id: tests-unchanged
  type: protected
  path: test_fib.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
