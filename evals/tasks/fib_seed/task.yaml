{
  "id": "fib_seed",
  "title": "fib_seed",
  "prompt": "阅读 fib.mjs，修复现有缺陷，通过 node --test test_fib.test.mjs。只允许修改 fib.mjs，不得修改测试。",
  "allowed_paths": [
    "fib.mjs"
  ],
  "protected_paths": [
    "test_fib.test.mjs"
  ],
  "items": [
    {
      "id": "tests-pass",
      "type": "command",
      "command": "node --test test_fib.test.mjs"
    },
    {
      "id": "tests-unchanged",
      "type": "protected",
      "path": "test_fib.test.mjs"
    }
  ],
  "budget": {
    "max_rounds": 10,
    "max_tokens": 80000,
    "max_seconds": 120
  },
  "max_fix_attempts": 3,
  "script": "script.json"
}
