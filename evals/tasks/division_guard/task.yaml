    "ratio.mjs"
  ],
  "protected_paths": [
    "test_ratio.test.mjs"
  ],
  "items": [
    {
      "id": "tests-pass",
      "type": "command",
      "command": "node --test test_ratio.test.mjs"
    },
    {
      "id": "tests-unchanged",
      "type": "protected",
      "path": "test_ratio.test.mjs"
    }
  ],
  "budget": {
    "max_rounds": 10,
    "max_tokens": 80000,
    "max_seconds": 120
  },
  "max_fix_attempts": 3,
  "script": "script.json"
}
