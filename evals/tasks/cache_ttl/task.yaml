id: cache_ttl
title: 缓存 TTL 判断错：is_fresh 把判断写反了：过期后反而返回 True，TTL 内反而返回 False
prompt: '运行 `python -m pytest test_cache_ttl.py -q` 有用例失败：is_fresh 把判断写反了：过期后反而返回 True，TTL
  内反而返回 False。

  请阅读 cache_ttl.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 cache_ttl.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- cache_ttl.py
protected_paths:
- test_cache_ttl.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_cache_ttl.py -q
- id: tests-unchanged
  type: protected
  path: test_cache_ttl.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
