id: mutable_default
title: 可变默认参数：两次独立调用共用同一个默认列表，第二次调用会带上第一次的商品
prompt: '运行 `python -m pytest test_cart.py -q` 有用例失败：两次独立调用共用同一个默认列表，第二次调用会带上第一次的商品。

  请阅读 cart.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 cart.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- cart.py
protected_paths:
- test_cart.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_cart.py -q
- id: tests-unchanged
  type: protected
  path: test_cart.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
