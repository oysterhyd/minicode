id: dedup_logic
title: 去重逻辑错：unique_values 去重失效，重复元素仍然保留
prompt: '运行 `python -m pytest test_dedup.py -q` 有用例失败：unique_values 去重失效，重复元素仍然保留。

  请阅读 dedup.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 dedup.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- dedup.py
protected_paths:
- test_dedup.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_dedup.py -q
- id: tests-unchanged
  type: protected
  path: test_dedup.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
