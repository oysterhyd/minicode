id: comparison_reversed
title: 比较运算符写反：in_range 对界内值返回 False、对界外值返回 True
prompt: '运行 `python -m pytest test_in_range.py -q` 有用例失败：in_range 对界内值返回 False、对界外值返回 True。

  请阅读 in_range.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 in_range.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- in_range.py
protected_paths:
- test_in_range.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_in_range.py -q
- id: tests-unchanged
  type: protected
  path: test_in_range.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
