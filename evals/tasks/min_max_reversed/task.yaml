id: min_max_reversed
title: min/max 写反：clamp 把 min/max 套反了，界内值也被推到边界外
prompt: '运行 `python -m pytest test_boundary.py -q` 有用例失败：clamp 把 min/max 套反了，界内值也被推到边界外。

  请阅读 boundary.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 boundary.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- boundary.py
protected_paths:
- test_boundary.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_boundary.py -q
- id: tests-unchanged
  type: protected
  path: test_boundary.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
