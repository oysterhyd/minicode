id: slugify_unicode
title: slugify 中文/unicode 处理错：中文字符被逐个替换成连字符，产生一串 '----' 而不是单个 '-'
prompt: '运行 `python -m pytest test_slugify.py -q` 有用例失败：中文字符被逐个替换成连字符，产生一串 ''----'' 而不是单个
  ''-''。

  请阅读 slugify.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 slugify.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- slugify.py
protected_paths:
- test_slugify.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_slugify.py -q
- id: tests-unchanged
  type: protected
  path: test_slugify.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
