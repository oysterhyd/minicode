id: float_rounding
title: 浮点舍入：apply_discount 把金额四舍五入成了整数，约定保留两位小数
prompt: '运行 `python -m pytest test_money.py -q` 有用例失败：apply_discount 把金额四舍五入成了整数，约定保留两位小数。

  请阅读 money.py，定位并修复其中的 bug，使该测试文件的全部用例通过。

  只允许修改 money.py，不要改动测试文件；完成后重新运行测试确认退出码为 0。

  '
allowed_paths:
- money.py
protected_paths:
- test_money.py
items:
- id: tests-pass
  type: command
  command: python -m pytest test_money.py -q
- id: tests-unchanged
  type: protected
  path: test_money.py
budget:
  max_rounds: 10
  max_tokens: 80000
  max_seconds: 120
max_fix_attempts: 3
script: script.json
