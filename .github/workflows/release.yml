name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - name: Install packaging tools
        run: npm ci --prefix release
      - name: Build and verify installer
        shell: pwsh
        run: ./release/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MiniCode-Windows-x64
          path: |
            release/dist/MiniCode-Setup-*-win-x64.exe
            release/dist/SHA256SUMS.txt
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title "MiniCode $env:GITHUB_REF_NAME" --generate-notes --verify-tag }
          gh release upload $env:GITHUB_REF_NAME release/dist/MiniCode-Setup-*-win-x64.exe release/dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
