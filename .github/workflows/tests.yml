name: tests

on:
  push:
  pull_request:

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install verified Windows dependency snapshot
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        run: python -m pip install -r requirements-windows-py312.lock
      - name: Install package and test dependencies
        if: matrix.os != 'windows-latest' || matrix.python-version != '3.12'
        run: python -m pip install -e ".[dev]"
      - name: Run deterministic tests
        run: |
          python -c "from pathlib import Path; Path('.pytest_cache').mkdir(exist_ok=True)"
          python -m pytest tests --basetemp .pytest_cache/ci-temp -q
      - name: Verify evaluation fixtures
        run: python evals/generate_tasks.py --verify
      - name: Verify long-log fixture is reproducible
        run: |
          python evals/scenarios/generate_trace.py
          git diff --exit-code -- evals/scenarios/log_context/repo/trace.log
      - name: Build installable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify bundled evaluation outside checkout
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.12'
        run: python tests/wheel_smoke.py
