name: tests

on:
  push:
  pull_request:

defaults:
  run:
    shell: pwsh

jobs:
  agent:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Check and build native agent
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
      - name: Integration and portable evaluation
        env:
          MINICODE_AGENT: ${{ github.workspace }}/target/debug/minicode${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node --test tests/agent/*.test.mjs
          node evals/generate-tasks.mjs --verify
          node evals/scenarios/generate-trace.mjs
          git diff --exit-code -- evals/tasks evals/scenarios/log_context/repo/trace.log
          ${{ github.workspace }}/target/debug/minicode${{ runner.os == 'Windows' && '.exe' || '' }} eval --baselines b0,b1,b2 --concurrency 3 --output output/eval
          ${{ github.workspace }}/target/debug/minicode${{ runner.os == 'Windows' && '.exe' || '' }} eval --tasks-dir evals/scenarios --baselines b0,b1,b2 --concurrency 3 --output output/scenarios
          node evals/verify-results.mjs output/eval output/scenarios

  tui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Build and test Ink with real Rust bridge
        env:
          MINICODE_TUI_BRIDGE_TEST: '1'
          MINICODE_AGENT: ${{ github.workspace }}/target/debug/minicode${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked
          npm ci --prefix tui
          npm run build --prefix tui
          npm test --prefix tui

  native-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: desktop/native/go.sum
      - name: Build shared Rust agent
        run: cargo build --locked
      - name: Verify native UI, workspace and Rust bridge
        env:
          MINICODE_AGENT: ${{ github.workspace }}/target/debug/minicode.exe
        working-directory: desktop/native
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 ./vendor/github.com/egoist/mygo/ui
      - name: Build native Windows executable
        working-directory: desktop/native
        run: ./build.ps1
