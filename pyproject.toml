[project]
name = "minicode"
version = "1.1.0"
description = "A resumable CLI coding agent harness with durable traces and evidence-based acceptance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0.48,<4",
    "jsonschema>=4.22,<5",
    "regex>=2024.11.6",
    "mcp==2.2.0",
]

[project.optional-dependencies]
# anthropic is imported lazily by providers.anthropic_provider; install only when
# using the real model adapter.
real = ["anthropic>=0.40"]
eval = ["pytest>=8.0"]
dev = ["pytest>=8.0", "anthropic>=0.40"]

[project.scripts]
minicode = "minicode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minicode"]

[tool.hatch.build.targets.wheel.force-include]
"evals" = "evals"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
