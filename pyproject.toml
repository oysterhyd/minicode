[project]
name = "minicode"
version = "0.1.0"
description = "Mini Claude Code - a lightweight CLI coding agent harness (P0: minimal closed loop)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "textual>=0.80",
    "mcp==2.2.0",
]

[project.optional-dependencies]
# anthropic is imported lazily by providers.anthropic_provider; install only when
# using the real model adapter.
real = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "anthropic>=0.40"]

[project.scripts]
minicode = "minicode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minicode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
